<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đăng nhập · Video Bot</title>
<meta name="description" content="Đăng nhập bảng điều khiển Video Bot bằng mật khẩu web (WEB_PASSWORD).">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;--bg:#f5f5f4;--card:#fff;--text:#1c1917;--mut:#6b6560;--line:#e7e5e4;--edge:#8a847e;--acc:#c2410c;--err:#b91c1c;--focus:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1917;--card:#292524;--text:#fafaf9;--mut:#b3aca6;--line:#44403c;--edge:#78716c;--err:#fca5a5;--focus:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;caret-color:var(--acc);
  padding:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
::selection{background:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
main{width:100%;max-width:380px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:1.375rem;margin:0 0 4px;text-wrap:balance}
p{margin:0 0 18px;color:var(--mut)}
label{display:block;font-size:.875rem;color:var(--mut);margin:10px 0 4px}
input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--edge);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
button{width:100%;min-height:44px;padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;margin-top:14px;cursor:pointer;touch-action:manipulation;transition:background-color .15s}
button:hover{background:#9a3412}
button:disabled{opacity:.55;cursor:default}
#msg{min-height:1.5em;margin:10px 0 0;font-size:.9375rem;color:var(--text)}
.err{color:var(--err)}
</style>
</head>
<body>
<main>
<form id="f" autocomplete="on" aria-labelledby="h-login">
  <h1 id="h-login">🎬 Video Bot</h1>
  <p>Đăng nhập để vào bảng điều khiển.</p>
  <label for="pw">Mật khẩu web (WEB_PASSWORD)</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required enterkeyhint="go">
  <button id="btn" type="submit">Đăng nhập</button>
  <p id="msg" role="status" aria-live="polite"></p>
</form>
</main>
<script>
const $=id=>document.getElementById(id);
const next='/';   // luôn về bảng điều khiển: không nhận ?next= (tránh bị dẫn sang trang khác)
if(matchMedia('(pointer: fine)').matches)$('pw').focus();   // điện thoại: không tự bật bàn phím che mất thông báo
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.password_set){$('msg').innerHTML='<span class="err">⚠️ Chưa đặt WEB_PASSWORD nên web panel đang khoá. Đặt biến môi trường WEB_PASSWORD rồi khởi động lại bot.</span>';$('btn').disabled=true;}
  else if(d.authed)location.replace(next);
}).catch(()=>{});
$('f').onsubmit=async e=>{
  e.preventDefault();$('btn').disabled=true;$('msg').textContent='Đang kiểm tra…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
    if(r.ok){location.replace(next);return;}
    $('msg').innerHTML='<span class="err">❌ '+String(await r.text()).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span>';
  }catch(err){$('msg').innerHTML='<span class="err">❌ Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.</span>';}
  $('pw').value='';$('btn').disabled=false;$('pw').focus();
};
</script>
</body>
</html>
