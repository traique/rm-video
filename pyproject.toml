[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["static"]

[tool.ruff.lint]
# F: lỗi thật (biến/import thừa, tên chưa định nghĩa); E9: lỗi cú pháp; B: bẫy hay gặp (closure trong vòng lặp...)
select = ["F", "E9", "B"]
# B905 zip(strict=) và B007 biến vòng lặp không dùng: chỉ là kiểu viết
ignore = ["B905", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
