[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["static"]

[tool.ruff.lint]
# F: lỗi thật (biến/import thừa, tên chưa định nghĩa); E9: lỗi cú pháp; B: bẫy hay gặp (closure trong vòng lặp...)
select = ["F", "E9", "B"]
# B905 zip(strict=) và B007 biến vòng lặp không dùng: chỉ là kiểu viết
ignore = ["B905", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Mã mới trong gói rmvideo/ kiểm kiểu chặt (mã cũ ở gốc chưa có chú thích kiểu nên chưa bật).
[tool.mypy]
python_version = "3.11"
files = ["rmvideo"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
follow_imports = "silent"         # mã cũ ở gốc chỉ dùng làm kiểu tham chiếu, không báo lỗi trong đó

[[tool.mypy.overrides]]
module = ["config", "queue_manager", "core_video", "pipeline", "kaggle_worker", "kaggle_api", "scenes", "prompt_engine"]
disallow_untyped_defs = false

# Mã điều phối chuyển nguyên văn từ pipeline.py (Phase 4): dict tự do chưa có kiểu, kiểm dần khi tách tiếp.
[[tool.mypy.overrides]]
module = ["rmvideo.app.flow.*"]
disallow_untyped_defs = false
ignore_errors = true
