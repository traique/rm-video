# Botkeep/Pterodactyl chạy với HOME = thư mục bot, nên pip đọc file này khi cài requirements.txt.
# Không giữ bộ nhớ đệm (~/.cache/pip): mỗi lần cài pip giữ thêm một bản sao mọi gói đã tải (~150MB), tính vào
# ổ 2GB của bot. Xoá file này nếu muốn pip dùng lại bộ nhớ đệm.
[global]
no-cache-dir = true
